name: Agenda deportiva

# Genera agenda.json (y services.json para el diagnóstico de la APK) y lo publica en la rama `agenda-data`.
#   Agenda:   Football-Data · Live Tennis · Jolpica (F1) · Blacktop (MotoGP) · Cito (UFC)
#   TV:       futbolenlatv.es/deporte (una sola descarga por ejecución, respetando robots.txt)
#   Retratos: Cito (UFC) · TheSportsDB (con caché larga en athletes.json)
#   Logos de canales: futbolenlatv (de la agenda) · iptv-org (1 vez/semana) → channel-logos.json
# La app descarga (con caché y ETag, como mucho cada 15 min) desde:
#   https://raw.githubusercontent.com/<usuario>/<repo>/agenda-data/agenda.json
#   https://raw.githubusercontent.com/<usuario>/<repo>/agenda-data/services.json
#   https://raw.githubusercontent.com/<usuario>/<repo>/agenda-data/channel-logos.json (como mucho 1 vez al día)
#
# Secrets (Settings → Secrets and variables → Actions):
#   FOOTBALL_DATA_TOKEN, LIVE_TENNIS_API_KEY, BLACKTOP_API_KEY, CITO_API_KEY
#   Opcional: THESPORTSDB_API_KEY (sin él se usa la clave pública gratuita de TheSportsDB)
on:
  schedule:
    - cron: "17 * * * *"   # una vez por hora, en el minuto 17
  workflow_dispatch:
  push:
    paths:
      - "tools/agenda/**"
      - ".github/workflows/agenda.yml"

permissions:
  contents: write

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # margen para la espera de 1 min de TheSportsDB si responde 429
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # El generador solo usa la biblioteca estándar de Python: no hay dependencias que instalar.
      - name: Tests del generador
        run: python -m unittest discover -s tools/agenda -v

      # Estado publicado en la ejecución anterior: agenda (para "stale"), historial de servicios,
      # catálogo de retratos, caché de UFC y catálogo de logos. Si no existe (primera vez), se empieza de cero.
      - name: Recuperar estado anterior
        run: |
          mkdir -p state publish
          if git fetch -q --depth 1 origin agenda-data 2>/dev/null; then
            for f in agenda.json services.json athletes.json ufc-cache.json channel-logos.json; do
              git show "FETCH_HEAD:$f" > "state/$f" 2>/dev/null || rm -f "state/$f"
            done
          fi
          ls -1 state || true

      # Código 3 = fallan TODAS las fuentes de agenda: no se genera agenda.json nueva, pero sí
      # services.json, para poder ver el problema desde la APK. Se publica la última agenda válida.
      - name: Generar agenda.json y services.json
        id: generate
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          LIVE_TENNIS_API_KEY: ${{ secrets.LIVE_TENNIS_API_KEY }}
          BLACKTOP_API_KEY: ${{ secrets.BLACKTOP_API_KEY }}
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
        run: |
          set +e
          python tools/agenda/generate_agenda.py \
            --out publish/agenda.json --previous state/agenda.json \
            --state-dir state --publish-dir publish --debug-dir debug
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
          if [ "$code" -eq 3 ]; then
            if [ -f state/agenda.json ]; then cp state/agenda.json publish/agenda.json; fi
            echo "::warning::Todas las fuentes de agenda han fallado: se mantiene la última agenda válida"
          fi

      # Respuestas crudas de las fuentes (sin cabeceras ni claves), incluido el HTML de /deporte:
      # sirven para ajustar los parsers si una fuente cambia su formato.
      - name: Guardar respuestas de depuración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-debug-${{ github.run_number }}
          path: |
            debug/
            publish/
          if-no-files-found: ignore
          retention-days: 3

      # Publica los JSON de estado sin reemplazar el historial de agenda-data.
      - name: Publicar en la rama agenda-data
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
        run: |
          if [ ! -f publish/agenda.json ]; then
            echo "No hay ninguna agenda válida que publicar"; exit 1
          fi
          if git ls-remote --exit-code --heads origin agenda-data > /dev/null; then
            git fetch -q --depth 1 origin agenda-data
            git worktree add --detach published-state FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            git worktree add --detach published-state HEAD
            git -C published-state switch --orphan agenda-data
          fi
          for f in agenda.json services.json athletes.json ufc-cache.json channel-logos.json; do
            if [ -f "publish/$f" ]; then cp "publish/$f" "published-state/$f"; fi
          done
          cd published-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -q -m "Agenda $(date -u +%Y-%m-%dT%H:%MZ)"
          fi
          git push -q origin HEAD:refs/heads/agenda-data
          echo "Publicado: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/agenda-data/agenda.json"

      # Fallo total: se ha publicado services.json con el problema, pero el workflow queda en rojo.
      - name: Marcar fallo total
        if: steps.generate.outputs.code == '3'
        run: |
          echo "::error::Ninguna fuente de agenda ha respondido; revisa Servicios en la APK o el log"
          exit 1
