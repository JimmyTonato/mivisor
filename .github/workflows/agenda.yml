name: Agenda deportiva

# Genera agenda.json desde futbolenlatv.es y lo publica en la rama `agenda-data`.
# La app lo descarga de:
#   https://raw.githubusercontent.com/<usuario>/<repo>/agenda-data/agenda.json
on:
  schedule:
    - cron: "7,37 * * * *"   # cada 30 min (minutos 7 y 37, evitando la hora en punto saturada)
  workflow_dispatch:
  push:
    paths:
      - "tools/agenda/**"
      - ".github/workflows/agenda.yml"

permissions:
  contents: write

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install --quiet beautifulsoup4==4.12.3 requests==2.32.3

      - name: Tests del scraper
        run: python -m unittest discover -s tools/agenda -v

      - name: Generar agenda.json
        run: python tools/agenda/scrape_agenda.py --out agenda.json --debug-dir debug

      # El HTML descargado se guarda siempre: si la web cambia, sirve para ajustar el parser.
      - name: Guardar HTML de depuración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agenda-debug-${{ github.run_number }}
          path: |
            debug/
            agenda.json
          if-no-files-found: ignore
          retention-days: 3

      # Rama huérfana con un único commit: el historial no crece aunque se publique cada 30 min.
      - name: Publicar en la rama agenda-data
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir publish && cp agenda.json publish/
          cd publish
          git init -q -b agenda-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agenda.json
          git commit -q -m "Agenda $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" agenda-data
          echo "Publicado: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/agenda-data/agenda.json"
