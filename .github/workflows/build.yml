name: Android CI

on:
  push:
    branches-ignore:
      - agenda-data
    paths-ignore:
      - "tools/agenda/**"
      - ".github/workflows/agenda.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Firma opcional con clave propia (ver README). Si no hay secrets, se usa app/debug.keystore.
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Firmando con la clave de GitHub Secrets"
          else
            echo "Firmando con app/debug.keystore (clave de desarrollo)"
          fi

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar APK release (R8)
        run: ./gradlew assembleRelease lintDebug --stacktrace

      - name: Preparar APK
        id: apk
        run: |
          NAME="MiVisor-4.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MiVisor-4.${{ github.run_number }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Subir informes (tests y lint)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar release (solo main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mi Visor 4.${{ github.run_number }}
          files: ${{ steps.apk.outputs.name }}
          make_latest: true
          body: |
            APK release (R8) para Android TV, móvil y tablet · Android 5.0+.
            Commit: ${{ github.sha }}
