name: Diagnóstico fuente TV
on:
  push:
    branches: [diagnostic/tv-source]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar analizador HTML
        run: python -m pip install beautifulsoup4==4.13.4
      - name: Comprobar robots y fuente TV
        run: python tools/diagnostics/test_tv_source.py
      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-source-diagnostic
          path: |
            robots.txt
            tv-source.html
            tv-source-report.json
            tv-source-log.txt
          if-no-files-found: error
          retention-days: 7
