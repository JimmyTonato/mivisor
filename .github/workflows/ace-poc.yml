name: Build Ace P2P Test APK

on:
  push:
    branches:
      - poc/ace-integrated-test
    paths:
      - 'acepoc/**'
      - '.github/workflows/ace-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout MiVisor POC
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android packages needed by POC
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Checkout independent P2P engine source
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/jamezrin/outpace.git "$RUNNER_TEMP/outpace"
          cd "$RUNNER_TEMP/outpace"
          git checkout a6586f4187f38e57c4dfc431ac47a6e49f4edf7f
          test "$(git rev-parse HEAD)" = "a6586f4187f38e57c4dfc431ac47a6e49f4edf7f"

      - name: Build P2P engine for Android ARM64 and ARMv7
        shell: bash
        run: |
          set -euxo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TOOLCHAIN/aarch64-linux-android23-clang"
          export CC_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android23-clang"
          export CXX_aarch64_linux_android="$TOOLCHAIN/aarch64-linux-android23-clang++"
          export AR_aarch64_linux_android="$TOOLCHAIN/llvm-ar"

          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$TOOLCHAIN/armv7a-linux-androideabi23-clang"
          export CC_armv7_linux_androideabi="$TOOLCHAIN/armv7a-linux-androideabi23-clang"
          export CXX_armv7_linux_androideabi="$TOOLCHAIN/armv7a-linux-androideabi23-clang++"
          export AR_armv7_linux_androideabi="$TOOLCHAIN/llvm-ar"

          cd "$RUNNER_TEMP/outpace"
          cargo build -p ace-engine --bin outpace --release --target aarch64-linux-android
          cargo build -p ace-engine --bin outpace --release --target armv7-linux-androideabi

          mkdir -p "$GITHUB_WORKSPACE/acepoc/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$GITHUB_WORKSPACE/acepoc/app/src/main/jniLibs/armeabi-v7a"

          cp "target/aarch64-linux-android/release/outpace"              "$GITHUB_WORKSPACE/acepoc/app/src/main/jniLibs/arm64-v8a/liboutpace.so"
          cp "target/armv7-linux-androideabi/release/outpace"              "$GITHUB_WORKSPACE/acepoc/app/src/main/jniLibs/armeabi-v7a/liboutpace.so"

          chmod 755 "$GITHUB_WORKSPACE/acepoc/app/src/main/jniLibs/arm64-v8a/liboutpace.so"
          chmod 755 "$GITHUB_WORKSPACE/acepoc/app/src/main/jniLibs/armeabi-v7a/liboutpace.so"

          file "$GITHUB_WORKSPACE/acepoc/app/src/main/jniLibs/arm64-v8a/liboutpace.so"
          file "$GITHUB_WORKSPACE/acepoc/app/src/main/jniLibs/armeabi-v7a/liboutpace.so"

      - name: Build test APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew -p acepoc :app:assembleDebug --stacktrace

      - name: Verify packaged native engine
        shell: bash
        run: |
          unzip -l acepoc/app/build/outputs/apk/debug/app-debug.apk | grep "lib/arm64-v8a/liboutpace.so"
          unzip -l acepoc/app/build/outputs/apk/debug/app-debug.apk | grep "lib/armeabi-v7a/liboutpace.so"

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp acepoc/app/build/outputs/apk/debug/app-debug.apk dist/MiVisor-AceP2P-Test.apk
          sha256sum dist/MiVisor-AceP2P-Test.apk | tee dist/MiVisor-AceP2P-Test.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiVisor-AceP2P-Test
          path: |
            dist/MiVisor-AceP2P-Test.apk
            dist/MiVisor-AceP2P-Test.apk.sha256
          if-no-files-found: error
          retention-days: 7
